enable-module-update = true
parallel-jobs = 1
remove-rv-integrations-checks = false

patches-source = "hoo-dles/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "both"
arch = "arm64-v8a"

[AdGuard]
app-name = "AdGuard"
pkg-name = "com.adguard.android"
arch = "arm64-v8a"
build-mode = "both"
version = "auto"
github-dlurl = "https://github.com/AdguardTeam/AdguardForAndroid"
apkmirror-dlurl = "https://www.apkmirror.com/apk/adguard-software-limited/adguard/"
uptodown-dlurl = "https://adguard.en.uptodown.com/android"
module-prop-name = "adguard-morphe"

[Prime-Video]
app-name = "Prime-Video"
pkg-name = "com.amazon.avod.thirdpartyclient"
arch = "arm64-v8a"
build-mode = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/amazon-mobile-llc/amazon-prime-video/"
uptodown-dlurl = "https://amazon-prime-video.en.uptodown.com/android"
excluded-patches = "'Rename shared permissions'"
module-prop-name = "prime-video-morphe"

[Twitch]
app-name = "Twitch"
pkg-name = "tv.twitch.android.app"
patches-source = "RookieEnough/De-Vanced"
arch = "arm64-v8a"
build-mode = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/twitch-interactive-inc/twitch/"
uptodown-dlurl = "https://twitch.en.uptodown.com/android"
module-prop-name = "twitch-morphe"

[Amazon-Music]
app-name = "Amazon-Music"
pkg-name = "com.amazon.mp3"
patches-source = "RookieEnough/De-Vanced"
arch = "arm64-v8a"
build-mode = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/amazon-mobile-llc/amazon-music-discover-songs/"
uptodown-dlurl = "https://amazon-music.en.uptodown.com/android"
excluded-patches = "'Rename shared permissions'"
module-prop-name = "amazon-music-morphe"
